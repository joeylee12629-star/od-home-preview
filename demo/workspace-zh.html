<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Design workspace demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#262626;--mute:#8c8c8c;--line:#e7e7e3;--acid:#63fe13;
  --sans:'Albert Sans',-apple-system,'PingFang SC',sans-serif}
html,body{height:100%}
body{font-family:var(--sans);background:#fafafa;display:flex;overflow:hidden;color:var(--ink);font-size:12px}
.projects{width:176px;flex:none;background:#f4f4f1;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.projects .hd{display:flex;align-items:center;gap:7px;padding:0 4px 10px}
.projects .hd img{width:18px;height:18px;border-radius:5px}
.projects .hd b{font-size:11.5px;font-weight:800}
.proj{display:flex;align-items:center;gap:8px;border-radius:9px;padding:8px 8px;cursor:pointer;transition:.15s;border:1px solid transparent}
.proj:hover{background:#fff}
.proj.on{background:#fff;border-color:#15140f1a;box-shadow:0 6px 14px -10px rgba(0,0,0,.15)}
.proj .ic{width:26px;height:26px;border-radius:7px;flex:none;overflow:hidden;border:1px solid #15140f14;background:#fff}
.proj .ic img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.proj .tx{min-width:0}
.proj .tx b{display:block;font-size:10.5px;font-weight:750;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .tx i{font-style:normal;font-size:8.5px;color:var(--mute);font-weight:650;white-space:nowrap}
.proj.on .tx i{color:#218c00}
.newp{margin-top:auto;border:1.5px dashed #15140f2b;border-radius:9px;padding:8px;text-align:center;
  font-size:10px;font-weight:750;color:#595959;cursor:pointer;flex:none}
.newp:hover{border-color:#15140f55}
.chat{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.chat .hd{display:flex;align-items:center;gap:7px;padding:12px 12px 8px;border-bottom:1px solid #f0f0ec}
.chat .hd img{width:16px;height:16px;border-radius:4px}
.chat .hd b{font-size:11.5px;font-weight:800}
.chat .hd i{font-style:normal;margin-left:auto;font-size:9px;font-weight:750;color:#218c00;background:#63fe1326;border-radius:99px;padding:3px 8px}
.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.mu{align-self:flex-end;background:var(--ink);color:#fff;border-radius:12px 12px 3px 12px;padding:8px 10px;
  font-size:11px;line-height:1.5;max-width:92%}
.ma{align-self:flex-start;background:#f4f4f1;border-radius:12px 12px 12px 3px;padding:8px 10px;font-size:11px;line-height:1.55;max-width:94%}
.ma .dlmini{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:99px;
  padding:6px 12px;font-size:10px;font-weight:750;cursor:pointer;margin-top:7px}
.ma .dlmini em{font-style:normal;color:var(--acid)}
.stepsline{align-self:flex-start;display:flex;flex-direction:column;gap:5px}
.stepsline div{font-size:10px;color:var(--mute);opacity:0;transform:translateY(3px);transition:.3s;line-height:1.4}
.stepsline div.show{opacity:1;transform:none}
.stepsline div.ok::before{content:'✓ ';color:#218c00;font-weight:800}
.stepsline div.run::before{content:'';display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--acid);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.ready{font-size:10.5px;font-weight:750;opacity:0;transition:.3s}
.ready.show{opacity:1}
.composer{display:flex;align-items:center;gap:7px;border-top:1px solid #f0f0ec;padding:10px 11px}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;font-family:var(--sans);
  font-size:11px;outline:none;color:var(--ink);min-width:0}
.composer input:focus{border-color:#26262666}
.composer button{width:26px;height:26px;border-radius:99px;background:var(--ink);color:var(--acid);border:0;flex:none;
  font-weight:900;font-size:13px;cursor:pointer;transition:.15s}
.composer button:hover{transform:translateY(-1px)}
.stage{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 18% 8%,#ffffff 0%,transparent 45%),
  repeating-linear-gradient(0deg,transparent 0 23px,#26262607 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,#26262607 23px 24px),#f0f0ed}
.artwrap{position:absolute;inset:14px;border-radius:12px;overflow:hidden;background:#fff;
  border:1px solid #15140f1f;box-shadow:0 30px 60px -32px rgba(20,20,15,.4);
  opacity:0;transform:scale(.97);filter:blur(8px);transition:.55s cubic-bezier(.23,1,.32,1)}
.artwrap.in{opacity:1;transform:none;filter:none}
.artwrap iframe{width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0;display:block;pointer-events:none}
body.live .artwrap iframe{pointer-events:auto}
body.live .stage{outline:2px solid #63fe1355;outline-offset:-2px}
/* 跟随悬停文字的编辑框 */
#ebox{position:absolute;border:1.5px solid var(--acid);box-shadow:0 0 0 1px #15140f14;
  opacity:0;pointer-events:none;z-index:6;transition:opacity .12s,left .08s linear,top .08s linear,width .08s linear,height .08s linear}
#ebox i{position:absolute;width:7px;height:7px;background:var(--acid);border:1.5px solid #fff;font-style:normal}
#ebox .c1{left:-4px;top:-4px}#ebox .c2{right:-4px;top:-4px}#ebox .c3{left:-4px;bottom:-4px}#ebox .c4{right:-4px;bottom:-4px}
#ebox .tag{position:absolute;left:-1px;top:-22px;background:var(--acid);color:#0d2601;font-family:var(--sans);
  font-size:9px;font-weight:800;border-radius:5px;padding:2px 8px;white-space:nowrap}
.skel{position:absolute;inset:14px;border-radius:12px;background:#ffffffb0;overflow:hidden;opacity:0;transition:.3s;pointer-events:none;z-index:3}
.skel.show{opacity:1}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,#ffffffd9,transparent);animation:shimmer 1.1s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.cap{position:absolute;left:22px;bottom:20px;z-index:5;background:#15140fd9;color:#fff;font-size:10px;
  font-weight:750;padding:6px 12px;border-radius:99px;backdrop-filter:blur(4px);pointer-events:none}
.cap em{font-style:normal;color:var(--acid)}
.edithint{position:absolute;right:22px;bottom:20px;z-index:5;background:#ffffffe6;border:1px solid #15140f1f;
  color:#434343;font-size:9.5px;font-weight:700;padding:5px 11px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
.stage:hover .edithint{opacity:1}
@media (max-width:760px){.projects{display:none}.chat{width:220px}}
@media (max-width:560px){.chat{display:none}}
@media (prefers-reduced-motion: reduce){.artwrap,.skel::after{transition:none;animation:none}}
</style></head><body>
<div class="projects">
  <div class="hd"><img src="https://open-design.ai/android-chrome-192x192.png" alt=""><b>我的项目</b></div>
  <div id="plist"></div>
  <div class="newp">+ 新建项目</div>
</div>
<div class="chat">
  <div class="hd"><img src="https://open-design.ai/android-chrome-192x192.png" alt=""><b>Open Design</b><i>智能体</i></div>
  <div class="log" id="log"></div>
  <div class="composer">
    <input id="inp" type="text" placeholder="问 Open Design 任何事…" autocomplete="off">
    <button id="send" aria-label="Send">↑</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="skel" id="skel"></div>
  <div class="artwrap" id="aw">
    <iframe id="artframe" src="" title="Live artifact" sandbox="allow-scripts allow-same-origin"></iframe>
    <span id="ebox"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><span class="tag">editable</span></span>
  </div>
  <span class="cap">实时产物 · <em id="capname"></em></span>
  <span class="edithint" id="ehint">✎ 点击画布进入交互</span>
</div>
<script>
var SCENES={
 web:[
  {name:'奢华地产网站', sub:'Web · 电影感滚动', icon:'art2/velar.png', cap:'真实页面,可滚动',
   url:'live/velar-luxury-real-estate/example.html',
   prompt:'用 Open Design 做一个电影感的奢华地产网站,每个区块都保持品牌一致。',
   steps:['读取品牌内核','确定视觉世界观','构建区块','输出预览']},
  {name:'Open Design 官网', sub:'Web · 我们自己的站', icon:'art2/odland.png', cap:'Open Design 官网,用 Open Design 做的',
   url:'live/open-design-landing/example.html',
   prompt:'Open Design 官网落地页,由我们自己的设计系统生成。',
   steps:['读取品牌内核','排布首屏与区块','撰写文案','输出预览']},
  {name:'Cloud 预约页', sub:'Web · 转化页', icon:'art2/waitlist.png', cap:'真实页面,表单可试',
   url:'live/waitlist-page/example.html',
   prompt:'Open Design Cloud 内测的预约等候页。',
   steps:['读取 campaign brief','组织卖点','接好表单','输出预览']}],
 mobile:[
  {name:'预订 App', sub:'移动端 · 可点按', icon:'art2/mobileapp.png', cap:'真实移动端 UI',
   url:'live/mobile-app/example.html',
   prompt:'预订 App,移动优先,和网站同一套设计系统。',
   steps:['读取产品 brief','排布关键屏','构建组件','接好点按流转']},
  {name:'游戏化习惯 App', sub:'移动端 · 趣味', icon:'art2/gamified.png', cap:'真实移动端 UI',
   url:'live/gamified-app/example.html',
   prompt:'游戏化的习惯打卡 App 原型,保持品牌感。',
   steps:['读取产品 brief','设计激励闭环','构建界面','接好点按流转']}],
 poster:[
  {name:'发布电子指南', sub:'营销 · 长图文', icon:'art2/eguide.png', cap:'真实 HTML 电子指南,可滚动',
   url:'live/digital-eguide/example.html',
   prompt:'Open Design 发布的电子指南,海报级排版。',
   steps:['读取 campaign brief','合成主视觉','排版章节','导出指南']}],
 slides:[
  {name:'瑞士风 Pitch Deck', sub:'演示 · 国际主义风格', icon:'art2/swiss.png', cap:'真实 HTML deck,里面可用 ← → 翻页',
   url:'live/deck-swiss-international/example.html',
   prompt:'Open Design 的 pitch deck,瑞士国际主义排版。',
   steps:['读取品牌内核','搭建网格','排版跨页','渲染 deck']},
  {name:'祖母绿编辑部 Deck', sub:'演示 · 编辑部风', icon:'art2/emerald.png', cap:'真实 HTML deck,里面可用 ← → 翻页',
   url:'live/fs-emerald-editorial/example.html',
   prompt:'季度回顾 deck,祖母绿编辑部风格。',
   steps:['读取品牌内核','梳理故事线','排版数据页','渲染 deck']},
  {name:'归藏杂志风 Deck', sub:'演示 · 杂志风', icon:'art2/guizang.png', cap:'真实 HTML deck,可滚动跨页',
   url:'live/deck-guizang-editorial/example.html',
   prompt:'Open Design 年度营销规划 deck,归藏杂志风。',
   steps:['读取品牌内核','搭建编辑部网格','排版跨页','渲染 deck']}],
 video:[
  {name:'发布片 · 3 镜头', sub:'视频 · HTML motion', icon:'art2/vfxcursor.png', cap:'HTML motion,正在实时播放',
   seq:['live/vt-vfx-text-cursor/index.html','live/frame-glitch-title/example.html','live/frame-logo-outro/example.html'],
   vw:1920, vh:1080,
   prompt:'Open Design 发布片,三个镜头:文字片头、故障标题、logo 收尾。',
   steps:['分镜:3 个场景','合成画面','制作文字动效','渲染序列']},
  {name:'Bold Signal · 3 镜头', sub:'视频 · HTML motion', icon:'art2/boldsignal.png', cap:'HTML motion,正在实时播放',
   seq:['live/vt-frame-bold-signal/index.html','live/frame-light-leak-cinema/example.html','live/frame-logo-outro/example.html'],
   vw:1920, vh:1080,
   prompt:'品牌色的 bold-signal 预告:signal 卡、电影标题、logo 收尾。',
   steps:['分镜:3 个场景','合成画面','制作 signal 动效','渲染序列']}]
};
var scene='web', cur=0;
var plist=document.getElementById('plist');
var log=document.getElementById('log'), inp=document.getElementById('inp'), send=document.getElementById('send');
var skel=document.getElementById('skel'), aw=document.getElementById('aw'), fr=document.getElementById('artframe');
var cap=document.getElementById('capname');
var ebox=document.getElementById('ebox'), etag=ebox.querySelector('.tag');
var timers=[];

function el(cls, html){var d=document.createElement('div');d.className=cls;d.innerHTML=html;return d;}

function renderList(){
  plist.innerHTML='';
  SCENES[scene].forEach(function(P,i){
    var d=el('proj'+(i===cur?' on':''),
      '<span class="ic"><img src="'+P.icon+'" alt=""></span><span class="tx"><b>'+P.name+'</b><i>'+P.sub+'</i></span>');
    d.addEventListener('click',function(){ if(i!==cur) openProject(i); });
    plist.appendChild(d);
  });
}

/* 编辑框:跟随内层文档里被悬停的文字元素(含滚动跟随) */
var lastEl=null, curS=0.5, offX=0, offY=0;
function fitFrame(P){
  if(P && P.vw){
    var W=aw.clientWidth, H=aw.clientHeight;
    var sc=Math.max(W/P.vw, H/P.vh);
    fr.style.width=P.vw+'px'; fr.style.height=P.vh+'px';
    offX=(W-P.vw*sc)/2; offY=(H-P.vh*sc)/2; curS=sc;
    fr.style.transformOrigin='0 0';
    fr.style.transform='translate('+offX+'px,'+offY+'px) scale('+sc+')';
  }else{
    fr.style.width='200%'; fr.style.height='200%';
    fr.style.transformOrigin='0 0'; fr.style.transform='scale(.5)';
    curS=0.5; offX=0; offY=0;
  }
}
window.addEventListener('resize',function(){ fitFrame(SCENES[scene][cur]); });
function hideBox(){ebox.style.opacity=0;lastEl=null;}
function placeBox(t){
  try{
    var r=t.getBoundingClientRect();
    if(r.width<3||r.height<3||r.bottom<0){hideBox();return;}
    var L=offX+r.left*curS, T=offY+r.top*curS;
    if(T>aw.clientHeight||L>aw.clientWidth){hideBox();return;}
    ebox.style.left=L+'px'; ebox.style.top=T+'px';
    ebox.style.width=(r.width*curS)+'px'; ebox.style.height=(r.height*curS)+'px';
    etag.textContent=t.tagName.toLowerCase()+' · 可编辑';
    ebox.style.opacity=1;
  }catch(e){hideBox();}
}
function bindEditTracking(){
  var doc; try{doc=fr.contentDocument}catch(e){return}
  if(!doc||!doc.body) return;
  try{doc.designMode='on';}catch(e){}
  doc.addEventListener('wheel',function(e){
    var se=doc.scrollingElement||doc.documentElement;
    var canScroll=se.scrollHeight-se.clientHeight>4;
    var atTop=se.scrollTop<=0, atEnd=se.scrollTop+se.clientHeight>=se.scrollHeight-2;
    if(!canScroll || (e.deltaY>0&&atEnd) || (e.deltaY<0&&atTop)){
      parent.postMessage({odScroll:e.deltaY},'*');
    }
  },{passive:true});
  function hasOwnText(n){
    for(var c=n.firstChild;c;c=c.nextSibling){ if(c.nodeType===3 && c.nodeValue.trim()) return true; }
    return false;
  }
  doc.addEventListener('mousemove',function(e){
    var el=e.target;
    if(!el || !el.closest){ hideBox(); return; }
    var t=el.closest('h1,h2,h3,h4,h5,h6,p,li,a,button,blockquote,figcaption,dt,dd,td,th,label,strong,em,b,span');
    if(!t){
      var n=el;
      for(var k=0;k<4 && n && n!==doc.body;k++){ if(hasOwnText(n)){ t=n; break; } n=n.parentElement; }
    }
    if(t && t.textContent && t.textContent.trim().length>0){ lastEl=t; placeBox(t); }
    else hideBox();
  },true);
  doc.addEventListener('scroll',function(){ if(lastEl) placeBox(lastEl); },true);
  if(doc.documentElement) doc.documentElement.addEventListener('mouseleave',hideBox,true);
}
fr.addEventListener('load',function(){
  bindEditTracking();
  aw.classList.add('in'); skel.classList.remove('show');
});

var seqTimer=null, seqIdx=0;
function startSeq(P){
  if(seqTimer){clearInterval(seqTimer);seqTimer=null;}
  if(!P.seq || P.seq.length<2) return;
  seqIdx=0;
  seqTimer=setInterval(function(){
    seqIdx=(seqIdx+1)%P.seq.length;
    aw.classList.remove('in');
    setTimeout(function(){ fr.src=P.seq[seqIdx]; },260);
  },4500);
}
function openProject(i){
  cur=i;
  renderList();
  hideBox();
  if(seqTimer){clearInterval(seqTimer);seqTimer=null;}
  timers.forEach(clearTimeout);timers=[];
  var P=SCENES[scene][i];
  log.innerHTML='';
  log.appendChild(el('mu', P.prompt));
  var sl=el('stepsline','');
  P.steps.forEach(function(st){var d=document.createElement('div');d.textContent=st;sl.appendChild(d);});
  var rd=document.createElement('div');rd.className='ready';rd.textContent='✦ 产物已生成。悬停文字即可编辑。';
  sl.appendChild(rd);
  log.appendChild(sl);
  aw.classList.remove('in'); skel.classList.add('show');
  fitFrame(P);
  fr.src=(P.seq? P.seq[0] : P.url); cap.textContent=P.cap;
  var kids=sl.querySelectorAll('div:not(.ready)');
  var t=200;
  kids.forEach(function(st,k){
    timers.push(setTimeout(function(){
      kids.forEach(function(x,j){x.className=j<k?'ok show':(j===k?'run show':x.className)});
    },t)); t+=520;
  });
  timers.push(setTimeout(function(){
    kids.forEach(function(x){x.className='ok show'});
    skel.classList.remove('show'); aw.classList.add('in'); rd.classList.add('show');
    startSeq(P);
  },t+160));
}

window.addEventListener('message',function(e){
  if(e.data && e.data.scene && SCENES[e.data.scene]){ scene=e.data.scene; cur=0; openProject(0); }
});



function userSend(){
  var v=(inp.value||'').trim();
  if(!v) return;
  inp.value='';
  log.appendChild(el('mu', v.replace(/[<>&]/g,'')));
  log.scrollTop=log.scrollHeight;
  setTimeout(function(){
    var a=el('ma','这里是在线演示。<b>下载客户端去体验完整的功能</b>,真实生成、编辑、导出都在客户端里。<br><span class="dlmini"><em>↓</em> Download free</span>');
    log.appendChild(a);
    log.scrollTop=log.scrollHeight;
    a.querySelector('.dlmini').addEventListener('click',function(){ parent.postMessage('od-download','*'); });
  },650);
}
send.addEventListener('click',userSend);
inp.addEventListener('keydown',function(e){ if(e.key==='Enter') userSend(); });

var stageEl=document.getElementById('stage'), ehint=document.getElementById('ehint');
stageEl.addEventListener('click',function(){
  if(!document.body.classList.contains('live')){
    document.body.classList.add('live');
    ehint.textContent='✎ 悬停任意文字,点击即可编辑';
  }
});
stageEl.addEventListener('mouseleave',function(){
  document.body.classList.remove('live');
  ehint.textContent='✎ 点击画布进入交互';
  hideBox();
});

/* 画面外暂停:整个 demo 不在视口时隐藏 iframe,停掉重绘 */
if('IntersectionObserver' in window){
  var vio=new IntersectionObserver(function(en){
    var vis=en[0].isIntersecting;
    fr.style.visibility=vis?'visible':'hidden';
    if(!vis && seqTimer){clearInterval(seqTimer);seqTimer=null;}
    else if(vis && !seqTimer){var P=SCENES[scene][cur]; if(P&&P.seq) startSeq(P);}
  },{threshold:0});
  vio.observe(document.body);
}

/* wsWheelRelay:空白区滚轮交还主页面 */
document.addEventListener('wheel',function(e){
  var sc=e.target.closest ? e.target.closest('.log,.projects') : null;
  if(sc){
    var can=sc.scrollHeight-sc.clientHeight>4;
    var atTop=sc.scrollTop<=0, atEnd=sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2;
    if(can && !((e.deltaY>0&&atEnd)||(e.deltaY<0&&atTop))) return;
  }
  parent.postMessage({odScroll:e.deltaY},'*');
},{passive:true});

renderList();
openProject(0);
</script>
</body></html>
