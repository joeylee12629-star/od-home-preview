<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Design workspace demo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#262626;--mute:#8c8c8c;--line:#e7e7e3;--acid:#63fe13;
  --sans:'Albert Sans',-apple-system,'PingFang SC',sans-serif}
html,body{height:100%}
body{font-family:var(--sans);background:#fafafa;display:flex;overflow:hidden;color:var(--ink);font-size:12px}
/* ── 列1:项目 ── */
.projects{width:172px;flex:none;background:#f4f4f1;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.projects .hd{display:flex;align-items:center;gap:7px;padding:0 4px 10px}
.projects .lg{width:17px;height:17px;border-radius:5px;background:var(--ink);position:relative;flex:none}
.projects .lg::after{content:'';position:absolute;inset:4px 4px 4px 8px;background:var(--acid);border-radius:2px}
.projects .hd b{font-size:11.5px;font-weight:800}
.proj{display:flex;align-items:center;gap:8px;border-radius:9px;padding:8px 8px;cursor:pointer;transition:.15s;border:1px solid transparent}
.proj:hover{background:#fff}
.proj.on{background:#fff;border-color:#15140f1a;box-shadow:0 6px 14px -10px rgba(0,0,0,.15)}
.proj .ic{width:26px;height:26px;border-radius:7px;flex:none;overflow:hidden;border:1px solid #15140f14}
.proj .ic img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.proj .tx b{display:block;font-size:10.5px;font-weight:750;line-height:1.25}
.proj .tx i{font-style:normal;font-size:8.5px;color:var(--mute);font-weight:650}
.proj.on .tx i{color:#218c00}
.newp{margin-top:auto;border:1.5px dashed #15140f2b;border-radius:9px;padding:8px;text-align:center;
  font-size:10px;font-weight:750;color:#595959;cursor:pointer}
.newp:hover{border-color:#15140f55}
/* ── 列2:对话 ── */
.chat{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.chat .hd{display:flex;align-items:center;gap:7px;padding:12px 12px 8px;border-bottom:1px solid #f0f0ec}
.chat .hd b{font-size:11.5px;font-weight:800}
.chat .hd i{font-style:normal;margin-left:auto;font-size:9px;font-weight:750;color:#218c00;background:#63fe1326;border-radius:99px;padding:3px 8px}
.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.mu{align-self:flex-end;background:var(--ink);color:#fff;border-radius:12px 12px 3px 12px;padding:8px 10px;
  font-size:11px;line-height:1.5;max-width:92%}
.ma{align-self:flex-start;background:#f4f4f1;border-radius:12px 12px 12px 3px;padding:8px 10px;font-size:11px;line-height:1.55;max-width:94%}
.ma .dlmini{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:99px;
  padding:6px 12px;font-size:10px;font-weight:750;cursor:pointer;margin-top:7px}
.ma .dlmini em{font-style:normal;color:var(--acid)}
.stepsline{align-self:flex-start;display:flex;flex-direction:column;gap:5px}
.stepsline div{font-size:10px;color:var(--mute);opacity:0;transform:translateY(3px);transition:.3s;line-height:1.4}
.stepsline div.show{opacity:1;transform:none}
.stepsline div.ok::before{content:'✓ ';color:#218c00;font-weight:800}
.stepsline div.run::before{content:'';display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--acid);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.ready{font-size:10.5px;font-weight:750;opacity:0;transition:.3s}
.ready.show{opacity:1}
.composer{display:flex;align-items:center;gap:7px;border-top:1px solid #f0f0ec;padding:10px 11px}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;font-family:var(--sans);
  font-size:11px;outline:none;color:var(--ink);min-width:0}
.composer input:focus{border-color:#26262666}
.composer button{width:26px;height:26px;border-radius:99px;background:var(--ink);color:var(--acid);border:0;flex:none;
  font-weight:900;font-size:13px;cursor:pointer;transition:.15s}
.composer button:hover{transform:translateY(-1px)}
/* ── 列3:产物 ── */
.stage{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 18% 8%,#ffffff 0%,transparent 45%),
  repeating-linear-gradient(0deg,transparent 0 23px,#26262607 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,#26262607 23px 24px),#f0f0ed}
.artwrap{position:absolute;inset:14px 14px 14px 14px;border-radius:12px;overflow:hidden;background:#fff;
  border:1px solid #15140f1f;box-shadow:0 30px 60px -32px rgba(20,20,15,.4);
  opacity:0;transform:scale(.97);filter:blur(8px);transition:.55s cubic-bezier(.23,1,.32,1)}
.artwrap.in{opacity:1;transform:none;filter:none}
.artwrap iframe{width:200%;height:200%;border:0;transform:scale(.5);transform-origin:0 0;display:block}
.skel{position:absolute;inset:14px;border-radius:12px;background:#ffffffb0;overflow:hidden;opacity:0;transition:.3s;pointer-events:none;z-index:3}
.skel.show{opacity:1}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,#ffffffd9,transparent);animation:shimmer 1.1s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.cap{position:absolute;left:22px;bottom:20px;z-index:5;background:#15140fd9;color:#fff;font-size:10px;
  font-weight:750;padding:6px 12px;border-radius:99px;backdrop-filter:blur(4px);pointer-events:none}
.cap em{font-style:normal;color:var(--acid)}
.editbox{position:absolute;left:14%;top:20%;width:44%;height:22%;border:1.5px solid var(--acid);
  box-shadow:0 0 0 1px #15140f14;opacity:0;transition:opacity .18s;pointer-events:none;z-index:4}
.editbox i{position:absolute;width:8px;height:8px;background:var(--acid);border:1.5px solid #fff;font-style:normal}
.editbox .c1{left:-5px;top:-5px}.editbox .c2{right:-5px;top:-5px}.editbox .c3{left:-5px;bottom:-5px}.editbox .c4{right:-5px;bottom:-5px}
.editbox .tag{position:absolute;left:-1px;top:-24px;background:var(--acid);color:#0d2601;font-family:var(--sans);
  font-size:9.5px;font-weight:800;border-radius:5px;padding:3px 8px;white-space:nowrap}
.editbox2{left:14%;top:50%;width:30%;height:13%}
.editbox2 .tag{background:#15140f;color:#fff}
.stage:hover .editbox{opacity:1}
.edithint{position:absolute;right:22px;bottom:20px;z-index:5;background:#ffffffe6;border:1px solid #15140f1f;
  color:#434343;font-size:9.5px;font-weight:700;padding:5px 11px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none}
.stage:hover .edithint{opacity:1}
@media (prefers-reduced-motion: reduce){.artwrap,.skel::after{transition:none;animation:none}}
</style></head><body>
<div class="projects">
  <div class="hd"><img src="https://open-design.ai/android-chrome-192x192.png" alt="" style="width:18px;height:18px;border-radius:5px"><b>My projects</b></div>
  <div id="plist"></div>
  <div class="newp">+ New project</div></div>
<div class="chat">
  <div class="hd"><img src="https://open-design.ai/android-chrome-192x192.png" alt="" style="width:16px;height:16px;border-radius:4px"><b>Open Design</b><i>Agent</i></div>
  <div class="log" id="log"></div>
  <div class="composer">
    <input id="inp" type="text" placeholder="Ask Open Design anything…" autocomplete="off">
    <button id="send" aria-label="Send">↑</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="skel" id="skel"></div>
  <div class="artwrap" id="aw"><iframe id="artframe" src="" title="Live artifact" sandbox="allow-scripts allow-same-origin"></iframe></div>
  <span class="editbox"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><span class="tag">Headline · editable</span></span>
  <span class="editbox editbox2"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><span class="tag">Body · editable</span></span>
  <span class="cap">Live artifact · <em id="capname"></em></span>
  <span class="edithint">✎ Click any text to edit</span>
</div>
<script>
var SCENES={
 slides:[
  {name:'Q3 pitch deck', sub:'Slides · 11 pages', icon:'art/slides-1.png', cap:'real HTML deck, use ← → inside',
   url:'live/html-ppt-pitch-deck/example.html',
   prompt:'Make the Q3 pitch deck for Brew & Co. Keep it on-brand.',
   steps:['Reading brand kernel','Outlining the deck','Laying out title + data pages','Rendering 11 slides']},
  {name:'Editorial deck', sub:'Slides · magazine style', icon:'art/slides-2.png', cap:'real HTML deck',
   url:'live/html-ppt-taste-editorial/example.html',
   prompt:'An editorial-style deck for the brand story.',
   steps:['Reading brand kernel','Setting editorial grid','Typesetting spreads','Rendering deck']}],
 proto:[
  {name:'Product landing', sub:'Web · live page', icon:'art/proto-1.png', cap:'real page, scroll it',
   url:'live/dating-web/example.html',
   prompt:'A landing page for the new product. One design system.',
   steps:['Reading product brief','Scaffolding sections','Writing copy','Shipping preview']},
  {name:'Mobile app', sub:'Mobile · clickable', icon:'art/proto-3.png', cap:'real mobile UI',
   url:'live/mobile-app/example.html',
   prompt:'Prototype the booking app for mobile, same design system.',
   steps:['Reading product brief','Laying out key screens','Building components','Wiring click-through']},
  {name:'Y2K microsite', sub:'Web · campaign', icon:'art/proto-2.png', cap:'real page, scroll it',
   url:'live/hps-y2k-chrome/example.html',
   prompt:'A chrome-Y2K campaign site for the drop.',
   steps:['Reading campaign brief','Setting the visual world','Building sections','Shipping preview']}],
 marketing:[
  {name:'Launch email', sub:'Marketing · HTML email', icon:'art/mkt-en.png', cap:'real HTML email',
   url:'live/email-marketing/example.html',
   prompt:'The launch announcement email, on-brand.',
   steps:['Reading campaign brief','Laying out sections','Writing copy','Inlining styles']},
  {name:'Blog post', sub:'Marketing · article', icon:'art/slides-2.png', cap:'real article page',
   url:'live/blog-post/example.html',
   prompt:'The launch blog post, in our voice.',
   steps:['Reading voice rules','Outlining the story','Writing copy','Typesetting article']}],
 video:[
  {name:'Launch film · 6s', sub:'Video · HTML motion', icon:'art/video-2.png', cap:'HTML motion, playing live',
   url:'live/frame-light-leak-cinema/example.html',
   prompt:'A 6-second launch title, HTML motion in brand colors.',
   steps:['Storyboard: 1 scene','Compositing frame','Animating type','Rendering preview']},
  {name:'Glitch title', sub:'Video · HTML motion', icon:'art/video-1.png', cap:'HTML motion, playing live',
   url:'live/frame-glitch-title/example.html',
   prompt:'A glitch title card for the teaser.',
   steps:['Storyboard: 1 scene','Compositing frame','Animating glitch','Rendering preview']}]
};
var scene='slides', cur=0;
var plist=document.getElementById('plist');
var log=document.getElementById('log'), inp=document.getElementById('inp'), send=document.getElementById('send');
var skel=document.getElementById('skel'), aw=document.getElementById('aw'), fr=document.getElementById('artframe');
var cap=document.getElementById('capname');
var timers=[];

function el(cls, html){var d=document.createElement('div');d.className=cls;d.innerHTML=html;return d;}

function renderList(){
  plist.innerHTML='';
  SCENES[scene].forEach(function(P,i){
    var d=el('proj'+(i===cur?' on':''),
      '<span class="ic"><img src="'+P.icon+'" alt=""></span><span class="tx"><b>'+P.name+'</b><i>'+P.sub+'</i></span>');
    d.addEventListener('click',function(){ if(i!==cur) openProject(i); });
    plist.appendChild(d);
  });
}

function openProject(i){
  cur=i;
  renderList();
  timers.forEach(clearTimeout);timers=[];
  var P=SCENES[scene][i];
  log.innerHTML='';
  log.appendChild(el('mu', P.prompt));
  var sl=el('stepsline','');
  P.steps.forEach(function(st){var d=document.createElement('div');d.textContent=st;sl.appendChild(d);});
  var rd=document.createElement('div');rd.className='ready';rd.textContent='✦ Artifact ready. Click anything to edit.';
  sl.appendChild(rd);
  log.appendChild(sl);
  aw.classList.remove('in'); skel.classList.add('show');
  fr.src=P.url; cap.textContent=P.cap;
  var kids=sl.querySelectorAll('div:not(.ready)');
  var t=200;
  kids.forEach(function(st,k){
    timers.push(setTimeout(function(){
      kids.forEach(function(x,j){x.className=j<k?'ok show':(j===k?'run show':x.className)});
    },t)); t+=520;
  });
  timers.push(setTimeout(function(){
    kids.forEach(function(x){x.className='ok show'});
    skel.classList.remove('show'); aw.classList.add('in'); rd.classList.add('show');
    try{ fr.contentDocument.designMode='on'; }catch(e){}
  },t+160));
}
fr.addEventListener('load',function(){
  try{ fr.contentDocument.designMode='on'; }catch(e){}
  aw.classList.add('in'); skel.classList.remove('show');
});

window.addEventListener('message',function(e){
  if(e.data && e.data.scene && SCENES[e.data.scene]){ scene=e.data.scene; cur=0; openProject(0); }
});

document.querySelector('.newp').addEventListener('click',function(){ parent.postMessage('od-download','*'); });

function userSend(){
  var v=(inp.value||'').trim();
  if(!v) return;
  inp.value='';
  log.appendChild(el('mu', v.replace(/[<>&]/g,'')));
  log.scrollTop=log.scrollHeight;
  setTimeout(function(){
    var a=el('ma','这里是在线演示。<b>下载客户端去体验完整的功能</b> — 真实生成、编辑、导出都在客户端里。<br><span class="dlmini"><em>↓</em> Download free</span>');
    log.appendChild(a);
    log.scrollTop=log.scrollHeight;
    a.querySelector('.dlmini').addEventListener('click',function(){ parent.postMessage('od-download','*'); });
  },650);
}
send.addEventListener('click',userSend);
inp.addEventListener('keydown',function(e){ if(e.key==='Enter') userSend(); });

renderList();
openProject(0);
</script>
</body></html>
