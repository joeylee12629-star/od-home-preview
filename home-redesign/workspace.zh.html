<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Design workspace demo</title>
<link rel="stylesheet" href="/od-home-preview/home-redesign/artifacts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#262626;--mute:#8c8c8c;--line:#e7e7e3;--acid:#63fe13;--grn:#1e8000;
  --sans:'Albert Sans','PingFang SC','Microsoft YaHei',sans-serif}
html,body{height:100%}
body{font-family:var(--sans);background:#fafafa;display:flex;overflow:hidden;color:var(--ink);font-size:12px}
.projects{width:176px;flex:none;background:#f4f4f1;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.projects .hd{display:flex;align-items:center;gap:7px;padding:0 4px 10px}
.projects .hd img{width:18px;height:18px;border-radius:6px}
.projects .hd b{font-size:11.5px;font-weight:800}
.proj{display:flex;align-items:center;gap:8px;border-radius:8px;padding:8px;cursor:pointer;transition:.15s;border:1px solid transparent}
.proj:hover{background:#fff}
.proj.on{background:#fff;border-color:#15140f1a;box-shadow:0 6px 14px -10px rgba(0,0,0,.15)}
.proj .ic{width:26px;height:26px;border-radius:6px;flex:none;background:var(--sw,#262626)}
.proj .tx{min-width:0}
.proj .tx b{display:block;font-size:10.5px;font-weight:750;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .tx i{font-style:normal;font-size:8.5px;color:var(--mute);font-weight:650;white-space:nowrap}
.proj.on .tx i{color:var(--grn)}
.newp{margin-top:auto;border:1.5px dashed #15140f2b;border-radius:8px;padding:8px;text-align:center;font-size:10px;font-weight:750;color:#595959;cursor:pointer;flex:none}
.chat{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.chat .hd{display:flex;align-items:center;gap:7px;padding:12px 12px 8px;border-bottom:1px solid #f0f0ec}
.chat .hd img{width:16px;height:16px;border-radius:6px}
.chat .hd b{font-size:11.5px;font-weight:800}
.chat .hd i{font-style:normal;margin-left:auto;font-size:9px;font-weight:750;color:var(--grn);background:#63fe1326;border-radius:999px;padding:3px 8px}
.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.mu{align-self:flex-end;background:var(--ink);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 10px;font-size:11px;line-height:1.5;max-width:92%}
.ma{align-self:flex-start;background:#f4f4f1;border-radius:12px 12px 12px 2px;padding:8px 10px;font-size:11px;line-height:1.55;max-width:94%}
.ma .dlmini{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 12px;font-size:10px;font-weight:750;cursor:pointer;margin-top:7px}
.ma .dlmini em{font-style:normal;color:var(--acid);display:inline-flex;align-items:center}
.stepsline{align-self:flex-start;display:flex;flex-direction:column;gap:5px}
.stepsline div{font-size:10px;color:var(--mute);opacity:0;transform:translateY(3px);transition:.3s;line-height:1.4}
.stepsline div.show{opacity:1;transform:none}
.stepsline div.ok::before{content:'✓ ';color:var(--grn);font-weight:800}
.stepsline div.run::before{content:'';display:inline-block;width:6px;height:6px;border-radius:999px;background:var(--acid);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.ready{font-size:10.5px;font-weight:750;opacity:0;transition:.3s}
.ready.show{opacity:1}
.composer{display:flex;align-items:center;gap:7px;border-top:1px solid #f0f0ec;padding:10px 11px}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-family:var(--sans);font-size:11px;outline:none;color:var(--ink);min-width:0}
.composer input:focus{border-color:#26262666}
.composer button{width:26px;height:26px;border-radius:999px;background:var(--ink);color:var(--acid);border:0;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.composer button:hover{transform:translateY(-1px)}
.stage{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 18% 8%,#ffffff 0%,transparent 45%),
  repeating-linear-gradient(0deg,transparent 0 23px,#26262607 23px 24px),
  repeating-linear-gradient(90deg,transparent 0 23px,#26262607 23px 24px),#f0f0ed}
/* Design-system switcher: the demo's control surface, so it is labelled,
   scrollable, and shows each system's accent as a swatch. */
.sysbar{position:absolute;left:14px;right:14px;top:14px;z-index:6;display:flex;align-items:center;gap:9px;
  background:#ffffffe8;backdrop-filter:blur(6px);border:1px solid #15140f1a;border-radius:999px;padding:6px 10px;
  box-shadow:0 10px 24px -18px rgba(20,20,15,.45);overflow-x:auto;scrollbar-width:none}
.sysbar::-webkit-scrollbar{display:none}
.sysbar-label{flex:none;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grn)}
.sysbar-chips{display:flex;gap:6px}
.sysbar-chips b{flex:none;display:inline-flex;align-items:center;gap:6px;font-weight:750;font-size:10px;color:#434343;
  background:#fff;border:1px solid #15140f1f;border-radius:999px;padding:4px 10px 4px 6px;cursor:pointer;white-space:nowrap;transition:.15s}
.sysbar-chips b:hover{border-color:#262626;color:#262626}
.sysbar-chips b.on{background:#262626;border-color:#262626;color:#fff}
.sysbar-chips i{width:12px;height:12px;border-radius:999px;flex:none;border:1px solid #15140f1f}
.artwrap{position:absolute;inset:56px 14px 14px;border-radius:12px;overflow:hidden;background:#fff;
  border:1px solid #15140f1f;box-shadow:0 30px 60px -32px rgba(20,20,15,.4);
  opacity:0;transform:scale(.97);filter:blur(8px);transition:.55s cubic-bezier(.23,1,.32,1)}
.artwrap.in{opacity:1;transform:none;filter:none}
.skel{position:absolute;inset:56px 14px 14px;border-radius:12px;background:#ffffffb0;overflow:hidden;opacity:0;transition:.3s;pointer-events:none;z-index:3}
.skel.show{opacity:1}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,#ffffffd9,transparent);animation:shimmer 1.1s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.cap{position:absolute;left:22px;bottom:20px;z-index:5;background:#15140fd9;color:#fff;font-size:10px;
  font-weight:750;padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px);pointer-events:none}
.cap em{font-style:normal;color:var(--acid)}
.edithint{position:absolute;right:22px;bottom:20px;z-index:5;background:#ffffffe6;border:1px solid #15140f1f;
  color:#434343;font-size:9.5px;font-weight:700;padding:5px 11px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}
.stage:hover .edithint{opacity:1}
#ebox{position:absolute;border:1.5px solid var(--acid);box-shadow:0 0 0 1px #15140f14;
  opacity:0;pointer-events:none;z-index:6;transition:opacity .12s,left .08s linear,top .08s linear,width .08s linear,height .08s linear}
#ebox i{position:absolute;width:7px;height:7px;background:var(--acid);border:1.5px solid #fff;font-style:normal}
#ebox .c1{left:-4px;top:-4px}#ebox .c2{right:-4px;top:-4px}#ebox .c3{left:-4px;bottom:-4px}#ebox .c4{right:-4px;bottom:-4px}
#ebox .tag{position:absolute;left:-1px;top:-22px;background:var(--acid);color:#0d2601;font-family:var(--sans);
  font-size:9px;font-weight:800;border-radius:6px;padding:2px 8px;white-space:nowrap}
@media (max-width:760px){.projects{display:none}.chat{width:220px}}
@media (max-width:560px){.chat{display:none}}
@media (prefers-reduced-motion: reduce){.artwrap,.skel::after{transition:none;animation:none}}
</style></head><body>
<div class="projects">
  <div class="hd"><img src="/od-home-preview/android-chrome-192x192.png" alt=""><b>我的项目</b></div>
  <div id="plist"></div>
  <div class="newp">+ 新建项目</div>
</div>
<div class="chat">
  <div class="hd"><img src="/od-home-preview/android-chrome-192x192.png" alt=""><b>Open Design</b><i>Agent</i></div>
  <div class="log" id="log"></div>
  <div class="composer">
    <input id="inp" type="text" placeholder="问 Open Design 任何问题…" autocomplete="off">
    <button id="send" aria-label="Send"><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10.8V3.4M2.7 6.6 6 3.3l3.3 3.3"/></svg></button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="sysbar"><span class="sysbar-label">设计系统</span><span class="sysbar-chips" id="sysbar"></span></div>
  <div class="skel" id="skel"></div>
  <div class="artwrap" id="aw">
    <div id="art"></div>
    <span id="ebox"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><span class="tag">editable</span></span>
  </div>
  <span class="cap">实时产物 · <em id="capname">由 token 渲染</em></span>
  <span class="edithint" id="ehint">✎ 点击画布开始交互</span>
</div>
<script src="/od-home-preview/home-redesign/artifacts.js"></script>
<script>
var LOCALE = "zh";
var SCENES = {"web":{"name":"营销官网","sub":"网页 · 落地页","prompt":"用我们的设计系统做一版发布落地页。","steps":["读取设计 token","排布首屏与卡片","撰写文案","渲染产物"]},"mobile":{"name":"产品 App","sub":"移动端 · 产品界面","prompt":"产品 App 首页，同一套设计系统。","steps":["读取设计 token","排布页面","搭建组件","渲染产物"]},"poster":{"name":"发布海报","sub":"营销 · 海报","prompt":"一张发布海报，字体层级来自品牌内核。","steps":["读取设计 token","构图主视觉","排版","渲染产物"]},"slides":{"name":"季度 Deck","sub":"演示 · 复盘","prompt":"季度复盘 Deck，保持品牌一致。","steps":["读取设计 token","梳理叙事","排布数据页","渲染产物"]}};
var STR = {"ready":"✦ 产物已就绪，悬停文字可编辑。","hint":"✎ 点击画布开始交互","hint2":"✎ 悬停任意文字，点击即可编辑","reply":"这里是在线演示。<b>下载客户端去体验完整的功能</b>，真实生成、编辑、导出都在客户端里。","dl":"免费下载","capname":"由 token 渲染"};
var SYSTEMS = [], scene = 'web', sysIndex = 0, timers = [];
var plist = document.getElementById('plist'), log = document.getElementById('log');
var inp = document.getElementById('inp'), send = document.getElementById('send');
var skel = document.getElementById('skel'), aw = document.getElementById('aw');
var art = document.getElementById('art'), cap = document.getElementById('capname');
var ebox = document.getElementById('ebox'), etag = ebox.querySelector('.tag');

function el(cls, html) { var d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; }

/* Left rail = what you are making (scene); the chip row = which design
   system it wears. Two axes, one control each. */
function renderList() {
  plist.innerHTML = '';
  Object.keys(SCENES).forEach(function (key) {
    var S = SCENES[key];
    var d = el('proj' + (key === scene ? ' on' : ''),
      '<span class="ic" style="background:' + SYSTEMS[sysIndex].accent + '"></span>' +
      '<span class="tx"><b>' + S.name + '</b><i>' + S.sub + '</i></span>');
    d.addEventListener('click', function () {
      if (key !== scene) { selectScene(key); parent.postMessage({ odScene: key }, '*'); }
    });
    plist.appendChild(d);
  });
}

function renderSysbar() {
  var bar = document.getElementById('sysbar');
  bar.innerHTML = '';
  SYSTEMS.forEach(function (sys, i) {
    var b = document.createElement('b');
    if (i === sysIndex) b.className = 'on';
    var sw = document.createElement('i');
    sw.style.background = sys.accent;
    b.appendChild(sw);
    b.appendChild(document.createTextNode(sys.label));
    b.addEventListener('click', function () { if (i !== sysIndex) selectSystem(i); });
    bar.appendChild(b);
  });
}

function paint() {
  ODArtifacts.applySystem(art, SYSTEMS[sysIndex]);
  ODArtifacts.guardAccentText(art, SYSTEMS[sysIndex]);
  ODArtifacts.render(art, scene, LOCALE);
  cap.textContent = SYSTEMS[sysIndex].label + ' · ' + STR.capname;
}

function runTranscript() {
  timers.forEach(clearTimeout); timers = [];
  var S = SCENES[scene];
  log.innerHTML = '';
  log.appendChild(el('mu', S.prompt + ' (' + SYSTEMS[sysIndex].label + ')'));
  var sl = el('stepsline', '');
  S.steps.forEach(function (st) { var d = document.createElement('div'); d.textContent = st; sl.appendChild(d); });
  var rd = document.createElement('div'); rd.className = 'ready'; rd.textContent = STR.ready;
  sl.appendChild(rd);
  log.appendChild(sl);
  var kids = sl.querySelectorAll('div:not(.ready)');
  var t = 160;
  kids.forEach(function (st, k) {
    timers.push(setTimeout(function () {
      kids.forEach(function (x, j) { x.className = j < k ? 'ok show' : (j === k ? 'run show' : x.className); });
    }, t));
    t += 420;
  });
  timers.push(setTimeout(function () {
    kids.forEach(function (x) { x.className = 'ok show'; });
    rd.classList.add('show');
  }, t + 120));
}

function selectSystem(i) {
  sysIndex = i;
  renderList(); renderSysbar(); hideBox();
  aw.classList.remove('in'); skel.classList.add('show');
  setTimeout(function () { paint(); skel.classList.remove('show'); aw.classList.add('in'); bindEditTracking(); }, 260);
  runTranscript();
}

function selectScene(next) {
  scene = next;
  renderList();
  aw.classList.remove('in'); skel.classList.add('show');
  setTimeout(function () { paint(); skel.classList.remove('show'); aw.classList.add('in'); bindEditTracking(); }, 260);
  runTranscript();
}

/* Hover-to-edit affordance: the artifact is live DOM, so designMode makes the
   "everything stays editable" claim literally true inside the demo. */
var lastEl = null;
function hideBox() { ebox.style.opacity = 0; lastEl = null; }
function placeBox(t) {
  var r = t.getBoundingClientRect(), a = aw.getBoundingClientRect();
  if (r.width < 3 || r.height < 3) { hideBox(); return; }
  ebox.style.left = (r.left - a.left) + 'px';
  ebox.style.top = (r.top - a.top) + 'px';
  ebox.style.width = r.width + 'px';
  ebox.style.height = r.height + 'px';
  etag.textContent = t.tagName.toLowerCase() + ' · editable';
  ebox.style.opacity = 1;
}
function bindEditTracking() {
  art.querySelectorAll('h1,p,b,span,i,li,u').forEach(function (n) {
    n.addEventListener('mouseenter', function () { if ((n.textContent || '').trim()) { lastEl = n; placeBox(n); } });
  });
}
art.addEventListener('mouseleave', hideBox);

var stageEl = document.getElementById('stage'), ehint = document.getElementById('ehint');
stageEl.addEventListener('click', function () {
  if (!document.body.classList.contains('live')) {
    document.body.classList.add('live');
    try { art.contentEditable = 'true'; } catch (e) {}
    ehint.textContent = STR.hint2;
  }
});
stageEl.addEventListener('mouseleave', function () {
  document.body.classList.remove('live');
  try { art.contentEditable = 'false'; } catch (e) {}
  ehint.textContent = STR.hint;
  hideBox();
});

function userSend() {
  var v = (inp.value || '').trim();
  if (!v) return;
  inp.value = '';
  log.appendChild(el('mu', v.replace(/[<>&]/g, '')));
  log.scrollTop = log.scrollHeight;
  setTimeout(function () {
    var a = el('ma', STR.reply + '<br><span class="dlmini"><em><svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 1.2v7.4M2.7 5.4 6 8.7l3.3-3.3"/></svg></em> ' + STR.dl + '</span>');
    log.appendChild(a);
    log.scrollTop = log.scrollHeight;
    a.querySelector('.dlmini').addEventListener('click', function () { parent.postMessage('od-download', '*'); });
  }, 620);
}
send.addEventListener('click', userSend);
inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') userSend(); });

window.addEventListener('message', function (e) {
  if (e.data && e.data.scene && SCENES[e.data.scene]) selectScene(e.data.scene);
});

/* Wheel over the demo scrolls the host page unless a pane can still scroll. */
document.addEventListener('wheel', function (e) {
  var sc = e.target.closest ? e.target.closest('.log,.projects') : null;
  if (sc) {
    var can = sc.scrollHeight - sc.clientHeight > 4;
    var atTop = sc.scrollTop <= 0, atEnd = sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 2;
    if (can && !((e.deltaY > 0 && atEnd) || (e.deltaY < 0 && atTop))) return;
  }
  parent.postMessage({ odScroll: e.deltaY }, '*');
}, { passive: true });

fetch('/od-home-preview/home-redesign/design-systems.json')
  .then(function (r) { return r.json(); })
  .then(function (data) {
    SYSTEMS = data;
    renderList(); renderSysbar(); paint(); runTranscript();
    aw.classList.add('in');
    bindEditTracking();
  })
  .catch(function () {});

</script>
</body></html>
